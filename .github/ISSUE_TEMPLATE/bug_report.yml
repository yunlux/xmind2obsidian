name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include the smallest safe example or command that reproduces the problem. Do not attach private XMind files or secrets.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Node.js version, OS, and xmind2canvas version
    validations:
      required: true
